# Mongo settings
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.username=${MONGO_USER:root}
spring.data.mongodb.password=${MONGO_PASS:toor}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.host=${MONGO_HOST:mongo}
spring.data.mongodb.database=${MONGO_DB_NAME:paymentdb}


# Kafka Settings
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
kafkaOrdersTopic=orders
kafkaErrorTopic=logging

# error settings
server.error.include-message=always
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*

