apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: micropayment-hpa
  namespace: dsbd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: micropayment-deploy
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
