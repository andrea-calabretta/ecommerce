apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: micropayment-hpa
  namespace: dsbd
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: micropayment-deploy
  minReplicas: 1
  maxReplicas: 3 
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
#      behavior:
#        scaleDown:
#          stabilizationWindowSeconds: 300 # Intervallo di stabilizzazione per il ridimensionamento verso il basso
#        intervalSeconds: 60 # Intervallo di valutazione dell'HPA
